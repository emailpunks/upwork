# Registry of pods this pipeline reconciles Upwork time submissions against
# Notion task records for. Non-secret config only — the Notion token lives in
# pods.secrets.yaml (gitignored) for local runs, or a GitHub Actions secret in
# CI (see README.md).
#
# - roles.<role>.task_codes maps the two-letter code a contractor logs
#   against a task to its fixed expected duration in minutes. This is the
#   only place duration comes from — Upwork submissions and Notion records
#   are both just checked against it, neither is itself a source of truth
#   for how long a code "should" take. Roles are shared across every pod
#   (a Designer's codes mean the same thing in every pod), not per-pod —
#   define each role once here.
# - pods[].contractors[].upwork_handle must match the handle Upwork shows in
#   parentheses after a contractor's name in the timesheet CSV's "Talent"
#   column (e.g. "Jane Doe (abc12de)" -> upwork_handle: "abc12de") — it's
#   stable, unlike the display name.
# - pods[].contractors[].name is how this contractor is identified in Notion
#   (whatever the "contractor" property in notion_property_map resolves to).
# - pods[].brands[].notion_database_id is the Notion database this brand's
#   completed-task log lives in. notion_property_map lets each brand's
#   database use its own property names (schemas aren't assumed to be
#   uniform across brands).
roles:
  coordinator:
    task_codes:
      HE: { label: "Ticket Building + Creative QA + Build QA", minutes: 60 }
      PE: { label: "Ticket Building + Build QA", minutes: 40 }
      SM: { label: "Ticket Building + Build QA", minutes: 40 }
      TM: { label: "Ticket Monitoring", minutes: 10 }
      DR: { label: "Deliverability Report", minutes: 10 }
  copywriter:
    task_codes:
      HE: { label: "HTML Copywriting", minutes: 60 }
      PE: { label: "Plain-Text Copywriting", minutes: 40 }
      SM: { label: "SMS Copywriting", minutes: 20 }
  designer:
    task_codes:
      HE: { label: "Email Design", minutes: 60 }
      HF: { label: "Footer Design", minutes: 30 }
      SF: { label: "Signup Form Design", minutes: 60 }
  technician:
    task_codes:
      HE: { label: "HTML Build", minutes: 20 }
      PE: { label: "Plain-Text Build", minutes: 20 }
      SM: { label: "SMS Build", minutes: 20 }
      HF: { label: "Footer Build", minutes: 20 }

# One example pod is filled in below to show the shape. Replace it with the
# real roster, or add more pods alongside it, whenever ready.
pods:
  - slug: pod-a
    name: "Pod A"
    brands:
      - name: "Example Brand"
        notion_database_id: "REPLACE_WITH_NOTION_DATABASE_ID"
        notion_property_map:
          contractor: "Assigned To"
          task_code: "Task Code"
          date: "Date"
    contractors:
      - name: "Example Contractor"
        upwork_handle: "abc12de"
        role: designer
