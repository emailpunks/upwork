# Registry of pods this pipeline reconciles Upwork time submissions against
# Notion task records for. Non-secret config only — the Notion token lives in
# pods.secrets.yaml (gitignored) for local runs, or a GitHub Actions secret in
# CI (see README.md).
#
# - roles.<role>.task_codes maps the two-letter code a contractor logs
#   against a task to its fixed expected duration in minutes. This is the
#   only place duration comes from — Upwork submissions and Notion records
#   are both just checked against it, neither is itself a source of truth
#   for how long a code "should" take. Roles are shared across every pod
#   (a Designer's codes mean the same thing in every pod), not per-pod —
#   define each role once here.
# - pods[].contractors[].upwork_handle must match the handle Upwork shows in
#   parentheses after a contractor's name in the timesheet CSV's "Talent"
#   column (e.g. "Jane Doe (abc12de)" -> upwork_handle: "abc12de") — it's
#   stable, unlike the display name.
# - pods[].contractors[].name is used for display and for the used-codes
#   ledger (pod_dashboard/ledger.py) — Notion itself has no per-contractor
#   assignment, a code is just a ticket any pod member can legitimately
#   submit once each.
# - pods[].brands[].notion_database_ids is the list of Notion databases
#   this brand's completed-task log lives in (a brand can span more than
#   one) — just tickets/codes, no assignee. notion_property_map only
#   needs "task_code" (the Notion property holding the full generated
#   code) and defaults to "Task Code" if omitted — only set it per-brand
#   if some database is set up differently.
#
# Contractors and brands don't have to be added here by hand — each pod's
# own page has a UI for both (no YAML editing required). Those additions
# live in pod_data/{slug}.json (see pod_dashboard/config.py) and are
# merged in on top of whatever's defined here, including for pods that
# don't have a pods.yaml entry at all yet.
# TEMPORARY — the old (pre-rename) code scheme, still showing up in real
# Upwork submissions. Unlike the new scheme, these aren't role-specific
# (same code = same duration regardless of role). Merged into every role
# below via the YAML anchor. DELETE this block (and its `<<: *legacy_task_codes`
# line in each role) once contractors have fully switched to the new codes.
_legacy_task_codes: &legacy_task_codes
  TB: { label: "(legacy) TB", minutes: 20 }
  CT: { label: "(legacy) CT", minutes: 20 }
  QA: { label: "(legacy) QA", minutes: 20 }
  TD: { label: "(legacy) TD", minutes: 60 }
  HC: { label: "(legacy) HC", minutes: 30 }
  PC: { label: "(legacy) PC", minutes: 30 }
  SC: { label: "(legacy) SC", minutes: 10 }

roles:
  coordinator:
    task_codes:
      <<: *legacy_task_codes
      HE: { label: "Ticket Building + Creative QA + Build QA", minutes: 60 }
      PE: { label: "Ticket Building + Build QA", minutes: 40 }
      SM: { label: "Ticket Building + Build QA", minutes: 40 }
      TM: { label: "Ticket Monitoring", minutes: 10 }
      DR: { label: "Deliverability Report", minutes: 10 }
  copywriter:
    task_codes:
      <<: *legacy_task_codes
      HE: { label: "HTML Copywriting", minutes: 60 }
      PE: { label: "Plain-Text Copywriting", minutes: 40 }
      SM: { label: "SMS Copywriting", minutes: 20 }
  designer:
    task_codes:
      <<: *legacy_task_codes
      HE: { label: "Email Design", minutes: 60 }
      HF: { label: "Footer Design", minutes: 30 }
      SF: { label: "Signup Form Design", minutes: 60 }
  technician:
    task_codes:
      <<: *legacy_task_codes
      HE: { label: "HTML Build", minutes: 20 }
      PE: { label: "Plain-Text Build", minutes: 20 }
      SM: { label: "SMS Build", minutes: 20 }
      HF: { label: "Footer Build", minutes: 20 }

# Pods are named P1, P2, etc.
pods:
  - slug: p1
    name: "P1"
    brands:
      - name: "CologneCurators"
        notion_database_ids:
