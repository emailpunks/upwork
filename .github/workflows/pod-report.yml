name: Pod reconciliation report

on:
  workflow_dispatch:
    inputs:
      csv_content:
        description: "Paste the full contents of the exported Upwork timesheet CSV"
        required: true
        type: string

concurrency:
  group: pod-report
  cancel-in-progress: false

permissions:
  contents: write # needed to commit used_codes/ back to the repo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Write CSV input to a file
        run: printf '%s' "$CSV_CONTENT" > timesheet.csv
        env:
          CSV_CONTENT: ${{ inputs.csv_content }}

      - name: Generate report
        run: python3 main.py timesheet.csv
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PYTHONUNBUFFERED: "1"

      # main.py updates used_codes/{slug}.json with any newly verified code,
      # so a future run knows it's already been claimed — see ledger.py.
      # Notion itself is never written to, so this file is the only record.
      - name: Commit updated code ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add used_codes/
          git diff --staged --quiet || git commit -m "Update used-code ledger from report run"
          git push

      - name: Deploy to Netlify
        run: npx --yes netlify-cli deploy --prod --dir=output
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
